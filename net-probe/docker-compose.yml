services:
  probe:
    image: alpine:3.20
    restart: "no"
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl bind-tools >/dev/null
        TS=$$(date -u +%FT%TZ)
        DBCHECK=$$(nslookup metabase 2>&1 | tail -3 | tr '\n' ';' || echo NA)
        DBPING=$$(getent hosts metabase 2>&1 || echo NXDOMAIN)
        BODY="net-probe ts=$$TS METABASE_DNS=[$$DBCHECK] METABASE_HOSTS=[$$DBPING]"
        echo "$$BODY"
        curl -s -d "$$BODY" "https://ntfy.sh/nsm-git-test-20ec3b6e60e9" >/dev/null
        tail -f /dev/null
